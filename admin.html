<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chord Boundary Admin</title>
  <style>
    body { background:#111; color:#fff; font-family:Arial,sans-serif; padding:16px; margin:0; }
    h2 { margin:0 0 14px; font-size:18px; }
    .controls { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:10px; align-items:flex-end; }
    .ctrl-group label { display:block; font-size:12px; color:#aaa; margin-bottom:4px; }
    select { padding:8px 10px; font-size:15px; border-radius:6px; background:#2a2a2a; color:#fff; border:1px solid #555; }
    .status { font-size:13px; color:#8cf; margin-bottom:10px; min-height:18px; }
    .svg-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; margin-bottom:12px; }
    #admin-svg { display:block; width:min(340px, 100vw - 32px); height:auto; }
    .btn-row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
    .btn-row button { padding:10px 18px; font-size:14px; border-radius:8px; cursor:pointer; border:none; font-weight:bold; }
    .btn-save   { background:#2a7a4a; color:#fff; }
    .btn-clear  { background:#7a2a2a; color:#fff; }
    .btn-export { background:#2a4a7a; color:#fff; }
    #json-output { width:100%; box-sizing:border-box; height:110px; background:#1a1a1a;
                   color:#4f4; font-family:monospace; font-size:12px;
                   border:1px solid #444; padding:8px; resize:vertical; }
    .hint { font-size:12px; color:#777; margin-top:6px; }
  </style>
</head>
<body>
<h2>Chord Boundary Admin</h2>

<div class="controls">
  <div class="ctrl-group">
    <label>Chord type</label>
    <select id="chord-type-sel">
      <option value="major">Major</option>
      <option value="minor">Minor</option>
      <option value="dim">Diminished</option>
      <option value="aug">Augmented</option>
      <option value="sus2">Sus2</option>
      <option value="sus4">Sus4</option>
    </select>
  </div>
  <div class="ctrl-group">
    <label>String set</label>
    <select id="string-set-sel">
      <option value="GBE">G-B-E (1,2,3)</option>
      <option value="DGB">D-G-B (2,3,4)</option>
      <option value="ADG">A-D-G (3,4,5)</option>
      <option value="EAD">E-A-D (4,5,6)</option>
    </select>
  </div>
</div>

<div class="status" id="status-text"></div>

<div class="svg-wrap">
  <svg id="admin-svg" viewBox="0 0 761 1404" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<div class="btn-row">
  <button class="btn-save"   onclick="saveBoundaries()">Save</button>
  <button class="btn-clear"  onclick="clearBoundaries()">Clear</button>
  <button class="btn-export" onclick="exportJSON()">Export JSON</button>
</div>
<textarea id="json-output" placeholder="Exported JSON appears here — copy and paste into code"></textarea>
<p class="hint">Tap between frets to toggle a boundary line. Red = root (1), dark orange = 3rd, orange = 5th. Reference root is always C.</p>

<script>
// ── Data ──────────────────────────────────────────────────────────────────────
const fretBoundaries = [0,72,198,378,502,597,699,807,900,1000,1105,1193,1286,1387];

const STR_X = [210, 268, 326, 386, 447, 510]; // x positions for strings 1–6

const neckNotes = {
  "btn1-string-1":"E",  "btn1-string-2":"B",  "btn1-string-3":"G",  "btn1-string-4":"D",  "btn1-string-5":"A",  "btn1-string-6":"E",
  "btn2-string-1":"F",  "btn2-string-2":"C",  "btn2-string-3":"G#", "btn2-string-4":"D#", "btn2-string-5":"A#", "btn2-string-6":"F",
  "btn3-string-1":"F#", "btn3-string-2":"C#", "btn3-string-3":"A",  "btn3-string-4":"E",  "btn3-string-5":"B",  "btn3-string-6":"F#",
  "btn4-string-1":"G",  "btn4-string-2":"D",  "btn4-string-3":"A#", "btn4-string-4":"F",  "btn4-string-5":"C",  "btn4-string-6":"G",
  "btn5-string-1":"G#", "btn5-string-2":"D#", "btn5-string-3":"B",  "btn5-string-4":"F#", "btn5-string-5":"C#", "btn5-string-6":"G#",
  "btn6-string-1":"A",  "btn6-string-2":"E",  "btn6-string-3":"C",  "btn6-string-4":"G",  "btn6-string-5":"D",  "btn6-string-6":"A",
  "btn7-string-1":"A#", "btn7-string-2":"F",  "btn7-string-3":"C#", "btn7-string-4":"G#", "btn7-string-5":"D#", "btn7-string-6":"A#",
  "btn8-string-1":"B",  "btn8-string-2":"F#", "btn8-string-3":"D",  "btn8-string-4":"A",  "btn8-string-5":"E",  "btn8-string-6":"B",
  "btn9-string-1":"C",  "btn9-string-2":"G",  "btn9-string-3":"D#", "btn9-string-4":"A#", "btn9-string-5":"F",  "btn9-string-6":"C",
  "btn10-string-1":"C#","btn10-string-2":"G#","btn10-string-3":"E", "btn10-string-4":"B", "btn10-string-5":"F#","btn10-string-6":"C#",
  "btn11-string-1":"D", "btn11-string-2":"A", "btn11-string-3":"F", "btn11-string-4":"C", "btn11-string-5":"G", "btn11-string-6":"D",
  "btn12-string-1":"D#","btn12-string-2":"A#","btn12-string-3":"F#","btn12-string-4":"C#","btn12-string-5":"G#","btn12-string-6":"D#",
  "btn13-string-1":"E", "btn13-string-2":"B", "btn13-string-3":"G", "btn13-string-4":"D", "btn13-string-5":"A", "btn13-string-6":"E",
};

const enharmonic = {"Ab":"G#","Bb":"A#","Cb":"B","Db":"C#","Eb":"D#","Fb":"E","Gb":"F#","B#":"C","E#":"F"};
const normalize = n => enharmonic[n] || n;

const CHORD_TYPES = {
  major: { label:"Major",      notes:["C","E","G"]    },
  minor: { label:"Minor",      notes:["C","D#","G"]   },
  dim:   { label:"Diminished", notes:["C","D#","F#"]  },
  aug:   { label:"Augmented",  notes:["C","E","G#"]   },
  sus2:  { label:"Sus2",       notes:["C","D","G"]    },
  sus4:  { label:"Sus4",       notes:["C","F","G"]    },
};

const STRING_SETS = {
  GBE: { label:"G-B-E", strings:[1,2,3], lowestString:3 },
  DGB: { label:"D-G-B", strings:[2,3,4], lowestString:4 },
  ADG: { label:"A-D-G", strings:[3,4,5], lowestString:5 },
  EAD: { label:"E-A-D", strings:[4,5,6], lowestString:6 },
};

// ── State ──────────────────────────────────────────────────────────────────────
let currentChordType = 'major';
let currentStringSet = 'GBE';
let activeBoundaryBtns = new Set(); // btn index after which the line is drawn

// ── SVG helpers ────────────────────────────────────────────────────────────────
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('admin-svg');

function el(tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, String(v));
  if (text !== undefined) e.textContent = text;
  return e;
}

function fretMidY(btn) {
  return (fretBoundaries[btn - 1] + fretBoundaries[btn]) / 2;
}

function findRootBtn(lowestString) {
  for (let b = 1; b <= 13; b++) {
    if (normalize(neckNotes[`btn${b}-string-${lowestString}`]) === 'C') return b;
  }
  return null;
}

// ── Build SVG ──────────────────────────────────────────────────────────────────
function buildSVG() {
  svg.innerHTML = '';

  const ss = STRING_SETS[currentStringSet];
  const ct = CHORD_TYPES[currentChordType];
  const chordNotes = ct.notes.map(normalize);
  const degreeColors = ['rgb(210,40,40)', 'rgb(230,85,15)', 'darkorange'];

  // Background
  svg.appendChild(el('rect', {x:0,y:0,width:761,height:1404,fill:'#0d1a28'}));

  // Fret dot markers (3,5,7,9,12)
  [3,5,7,9].forEach(fret => {
    const y = fretMidY(fret + 1);
    svg.appendChild(el('circle', {cx:160, cy:y, r:14, fill:'#2a3a4a'}));
  });
  const y12a = fretMidY(13), y12b = fretMidY(13);
  svg.appendChild(el('circle', {cx:148, cy:y12b - 30, r:12, fill:'#2a3a4a'}));
  svg.appendChild(el('circle', {cx:148, cy:y12b + 30, r:12, fill:'#2a3a4a'}));

  // Nut
  svg.appendChild(el('rect', {x:185, y:0, width:345, height:8, fill:'#d4c080'}));

  // Fret lines + numbers
  for (let i = 1; i < fretBoundaries.length; i++) {
    svg.appendChild(el('line', {
      x1:185, y1:fretBoundaries[i], x2:530, y2:fretBoundaries[i],
      stroke:'#444', 'stroke-width':3
    }));
    // Fret number label
    svg.appendChild(el('text', {
      x:548, y:fretMidY(i + 1),
      'text-anchor':'start', 'dominant-baseline':'central',
      fill:'#556', 'font-size':'28', 'font-family':'Arial,sans-serif'
    }, String(i)));
  }

  // String lines
  for (let s = 1; s <= 6; s++) {
    const x = STR_X[s - 1];
    const active = ss.strings.includes(s);
    svg.appendChild(el('line', {
      x1:x, y1:0, x2:x, y2:1404,
      stroke: active ? '#aaa' : '#333',
      'stroke-width': active ? 3 : 1.5
    }));
  }

  // Clickable gap zones + boundary lines
  for (let btn = 1; btn <= 12; btn++) {
    const y = fretBoundaries[btn];
    const zoneH = 80;
    const isBoundary = activeBoundaryBtns.has(btn);

    const zone = el('rect', {
      x:185, y: y - zoneH / 2, width:345, height:zoneH,
      fill: isBoundary ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0)',
      cursor:'pointer'
    });
    zone.addEventListener('click', () => toggleBoundary(btn));
    svg.appendChild(zone);

    if (isBoundary) {
      svg.appendChild(el('line', {
        x1:185, y1:y, x2:530, y2:y,
        stroke:'white', 'stroke-width':6, 'stroke-dasharray':'24,14',
        'pointer-events':'none'
      }));
    }
  }

  // Note circles
  for (let btn = 1; btn <= 13; btn++) {
    const cy = fretMidY(btn);
    for (const s of ss.strings) {
      const note = normalize(neckNotes[`btn${btn}-string-${s}`]);
      const idx = chordNotes.indexOf(note);
      if (idx === -1) continue;
      const cx = STR_X[s - 1];
      svg.appendChild(el('circle', {cx, cy, r:30, fill:degreeColors[idx] || 'darkorange', 'pointer-events':'none'}));
      svg.appendChild(el('text', {
        x:cx, y:cy, 'text-anchor':'middle', 'dominant-baseline':'central',
        fill:'white', 'font-size':'34', 'font-weight':'bold', 'font-family':'Arial,sans-serif',
        'pointer-events':'none'
      }, ['1','3','5'][idx] || ''));
    }
  }

  updateStatus();
}

function toggleBoundary(btn) {
  if (activeBoundaryBtns.has(btn)) activeBoundaryBtns.delete(btn);
  else activeBoundaryBtns.add(btn);
  buildSVG();
}

function updateStatus() {
  const ss = STRING_SETS[currentStringSet];
  const ct = CHORD_TYPES[currentChordType];
  const rootBtn = findRootBtn(ss.lowestString);
  const offsets = computeOffsets();
  document.getElementById('status-text').textContent =
    `C ${ct.label} on ${ss.label} | root C at btn${rootBtn} on string ${ss.lowestString} | offsets: [${offsets}]`;
}

function getStorageKey() { return `${currentChordType}-${currentStringSet}`; }

function computeOffsets() {
  const ss = STRING_SETS[currentStringSet];
  const rootBtn = findRootBtn(ss.lowestString);
  if (!rootBtn) return [];
  return [...activeBoundaryBtns].sort((a,b) => a-b).map(btn => btn - rootBtn);
}

function saveBoundaries() {
  const data = JSON.parse(localStorage.getItem('chordBoundaries') || '{}');
  data[getStorageKey()] = computeOffsets();
  localStorage.setItem('chordBoundaries', JSON.stringify(data));
  document.getElementById('status-text').textContent =
    `✓ Saved "${getStorageKey()}" = [${data[getStorageKey()]}]`;
}

function clearBoundaries() {
  activeBoundaryBtns.clear();
  buildSVG();
}

function exportJSON() {
  const data = JSON.parse(localStorage.getItem('chordBoundaries') || '{}');
  document.getElementById('json-output').value = JSON.stringify(data, null, 2);
}

function loadCurrentBoundaries() {
  const data = JSON.parse(localStorage.getItem('chordBoundaries') || '{}');
  const offsets = data[getStorageKey()] || [];
  const ss = STRING_SETS[currentStringSet];
  const rootBtn = findRootBtn(ss.lowestString);
  activeBoundaryBtns.clear();
  if (rootBtn) {
    offsets.forEach(offset => {
      const btn = rootBtn + offset;
      if (btn >= 1 && btn <= 12) activeBoundaryBtns.add(btn);
    });
  }
  buildSVG();
}

// ── Events ────────────────────────────────────────────────────────────────────
document.getElementById('chord-type-sel').addEventListener('change', e => {
  currentChordType = e.target.value;
  loadCurrentBoundaries();
});
document.getElementById('string-set-sel').addEventListener('change', e => {
  currentStringSet = e.target.value;
  loadCurrentBoundaries();
});

// ── Init ──────────────────────────────────────────────────────────────────────
loadCurrentBoundaries();
</script>
</body>
</html>
